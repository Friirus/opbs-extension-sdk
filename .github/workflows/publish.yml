name: Publier @opbs/extension-sdk

# Manuel, jamais sur push : publier un paquet npm est irréversible passé 72 heures
# (dépublication interdite, nom réservé définitivement). On ne veut pas d'un push qui
# déclenche ça par erreur. Ce dépôt est le miroir public (lecture seule) de
# packages/extension-sdk dans Friirus/opbs, source de vérité pour le code — c'est ici,
# et seulement ici, qu'on publie, parce que l'attestation de provenance npm exige que
# le dépôt GitHub Actions d'origine soit public.
on:
  workflow_dispatch:
    inputs:
      otp:
        description: "Code 2FA npm (laisser vide si le token est de type Automation/Granular sans OTP)"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # requis pour l'attestation de provenance (Sigstore/OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Installer les dépendances
        run: pnpm install --no-frozen-lockfile

      - name: Construire le SDK
        run: pnpm build

      - name: Tester le SDK
        run: pnpm test

      - name: Vérifier le contenu du paquet avant publication
        run: pnpm pack --dry-run

      - name: Publier sur npm
        run: |
          pnpm publish --access public --provenance --no-git-checks \
            ${{ inputs.otp != '' && format('--otp={0}', inputs.otp) || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
